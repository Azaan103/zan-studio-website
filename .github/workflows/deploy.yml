name: Deploy ZAN STUDIO

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FORM_PROVIDER: ${{ vars.VITE_FORM_PROVIDER }}
          VITE_WEB3FORMS_KEY: ${{ vars.VITE_WEB3FORMS_KEY }}
          VITE_FORMSPREE_ID: ${{ vars.VITE_FORMSPREE_ID }}
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4